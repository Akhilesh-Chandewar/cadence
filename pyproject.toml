[project]
name = "cadence"
version = "0.1.0"
description = "Cadence — a time series analysis harness: ingest, diagnose, plan, forecast, report."
readme = "README.md"
# Spec §10: pin to 3.11 — numba/statsforecast and friends lag on newer CPythons.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "statsmodels>=0.14.1",
    "statsforecast>=1.7.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadence"]

# Spec §8: one extra per foundation model — never co-installed by default
# (uni2ts/timesfm pull JAX, which can conflict with torch-based tiers).
[project.optional-dependencies]
# transformers capped below 5.x: v5 requires torch>=2.5, conflicting with the
# dl group's torch pin — 4.x works with both chronos and torch 2.4.
chronos = ["chronos-forecasting>=1.5.0", "transformers>=4.48,<5"]
moirai = ["uni2ts>=1.2.0"]
timesfm = ["timesfm>=1.3.0"]
darts = ["darts[torch]>=0.30.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
llm = ["litellm>=1.50.0"]
ml = ["mlforecast>=0.13.0", "lightgbm>=4.3.0"]
dl = ["neuralforecast>=1.7.0"]

# Tier 3 runs on CPU here — pull torch from the CPU-only index so the dl group
# doesn't drag in ~2.5GB of CUDA wheels (spec §14: CPU-only deployments must work).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
