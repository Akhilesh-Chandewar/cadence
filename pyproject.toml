[project]
name = "cadence"
version = "0.1.0"
description = "Cadence — a time series analysis harness: ingest, diagnose, plan, forecast, report."
readme = "README.md"
# Spec §10: pin to 3.11 — numba/statsforecast and friends lag on newer CPythons.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "statsmodels>=0.14.1",
    "statsforecast>=1.7.0",
    "langgraph>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

# Spec §8: one extra per foundation model — never co-installed by default
# (uni2ts/timesfm pull JAX, which can conflict with torch-based tiers).
[project.optional-dependencies]
chronos = ["chronos-forecasting>=1.5.0"]
moirai = ["uni2ts>=1.2.0"]
timesfm = ["timesfm>=1.3.0"]
darts = ["darts[torch]>=0.30.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
llm = ["litellm>=1.50.0"]
ml = ["mlforecast>=0.13.0", "lightgbm>=4.3.0"]
dl = ["neuralforecast>=1.7.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
